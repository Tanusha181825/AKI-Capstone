[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-iv-preprocessing"
version = "0.1.0"
description = "Memory-conscious Person 2 MIMIC-IV structured preprocessing"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
mimic-preprocess = "mimic_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
